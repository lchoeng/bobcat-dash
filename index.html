<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bobcat Dash</title>
<style>
:root{--bg:#fff;--fg:#10204f;--ac:#f5a300;--card:#eef1fa;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162b;--fg:#f2f4ff;--card:#1d2545}}
:root[data-theme="dark"]{--bg:#10162b;--fg:#f2f4ff;--card:#1d2545}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:400px;margin:0 auto;padding:8px;text-align:center}
h1{font-size:24px;margin:4px 0;letter-spacing:1px;color:var(--fg)}
h1 span{color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
button{font:inherit;border:2px solid var(--ac);background:var(--card);color:var(--fg);border-radius:12px;padding:6px 10px;cursor:pointer}
button.on{background:var(--ac);color:#10204f;font-weight:700}
.ban{background:#fff;border-radius:14px;padding:4px;margin:4px 0}.ban img{width:100%;display:block}
.kid{width:84px;padding:4px}.kid canvas{display:block;margin:0 auto}.kid small{display:block;font-weight:600}
#play{background:var(--ac);color:#10204f;font-weight:800;font-size:20px;padding:10px 28px;margin:8px 0}
#game{display:none;position:relative}
canvas#c{width:100%;max-width:360px;border-radius:14px;border:3px solid var(--fg);touch-action:none}
#hud{display:flex;justify-content:space-between;font-weight:700;padding:2px 6px}
#pad{display:flex;gap:10px;margin-top:6px}#pad button{flex:1;font-size:28px;padding:10px}
#msg{min-height:20px;font-size:14px}
</style></head><body><div id="app">
<h1><span>BOBCAT</span> DASH</h1>
<div id="menu"><div class="ban"><img id="ban" alt="Mary Bragg Bobcats"></div>
<div>Pick your runner</div><div class="row" id="kids"></div>
<div>Pick a place</div><div class="row" id="places"></div>
<button id="play">Play!</button>
<div style="font-size:13px">Dodge everyone else, silly stuff, and the Bobcat! Arrow keys, tap sides, or use the buttons.</div>
</div>
<div id="game"><div id="hud"><span id="sc">Score 0</span><span id="lv">❤️❤️❤️</span><span id="bs">Best 0</span></div>
<canvas id="c" width="360" height="520"></canvas>
<div id="pad"><button id="L">◀</button><button id="R">▶</button></div><div id="msg"></div></div>
</div>

function spr(g,im,x,y,s,H){const h=H*s,w=im.width*h/im.height;if(im.width)g.drawImage(im,x-w/2,y+46*s-h,w,h)}
function drawKid(g,c,x,y,s){spr(g,IMG[c.n],x,y,s,90)}
function drawBob(g,x,y,s){spr(g,IMG.Bobcat,x,y,s,100)}
document.getElementById('ban').src='data:image/png;base64,'+DATA.banner;
const kidsEl=document.getElementById('kids'),plEl=document.getElementById('places');
KIDS.forEach((k,i)=>{const b=document.createElement('button');b.className='kid'+(i==0?' on':'');
 const cv=document.createElement('img');cv.src='data:image/png;base64,'+DATA[k.n];cv.style.height='70px';
 b.append(cv);b.insertAdjacentHTML('beforeend','<small>'+k.n+'</small>');
 b.onclick=()=>{sel=i;[...kidsEl.children].forEach((e,j)=>e.classList.toggle('on',j==i))};kidsEl.append(b)});
Object.keys(PLACES).forEach((p,i)=>{const b=document.createElement('button');b.textContent=p;if(!i)b.className='on';
 b.onclick=()=>{place=p;[...plEl.children].forEach(e=>e.classList.toggle('on',e==b))};plEl.append(b)});
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=360,H=520,LN=4,LW=W/LN,PY=430;
let me,objs,lane,px,lives,score,t,spd,run,inv,last,spawn,off;
function start(){me=KIDS[sel];objs=[];lane=1;px=lane*LW+LW/2;lives=3;score=0;spd=170;spawn=0;inv=0;off=0;run=true;
 document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';
 document.getElementById('msg').textContent='';last=performance.now();requestAnimationFrame(loop)}
document.getElementById('play').onclick=start;
function mv(d){if(run)lane=Math.max(0,Math.min(LN-1,lane+d))}
L.onclick=()=>mv(-1);R.onclick=()=>mv(1);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();mv(e.clientX-r.left<r.width/2?-1:1)});
addEventListener('keydown',e=>{if(['ArrowLeft','a'].includes(e.key))mv(-1);if(['ArrowRight','d'].includes(e.key))mv(1)});
function add(){const P=PLACES[place],r=Math.random(),l=Math.floor(Math.random()*LN);
 if(r<0.18)objs.push({t:'b',l,y:-60,v:1.25});
 else if(r<0.55){const o=KIDS.filter(k=>k!==me);objs.push({t:'k',k:o[Math.floor(Math.random()*o.length)],l,y:-60,v:1})}
 else objs.push({t:'i',e:P.items[Math.floor(Math.random()*P.items.length)],l,y:-60,v:1})}
function loop(now){if(!run)return;const dt=Math.min(0.05,(now-last)/1000);last=now;
 score+=dt*10;spd+=dt*4;spawn-=dt;off=(off+spd*dt)%80;if(inv>0)inv-=dt;
 if(spawn<=0){add();spawn=Math.max(0.35,0.85-score/400)}
 const tx=lane*LW+LW/2;px+=(tx-px)*Math.min(1,dt*14);
 objs.forEach(o=>o.y+=spd*o.v*dt);objs=objs.filter(o=>o.y<H+70);
 if(inv<=0)for(const o of objs){if(o.l===lane&&Math.abs(o.y-PY)<42){lives--;inv=1.2;o.y=H+99;
  if(lives<=0){run=false;best=Math.max(best,Math.floor(score));draw();over(o);return}}}
 draw();requestAnimationFrame(loop)}
function over(o){document.getElementById('msg').innerHTML='Oh no! Score '+Math.floor(score)+'. <button id="again">Play again</button> <button id="menub">Menu</button>';
 again.onclick=start;menub.onclick=()=>{game.style.display='none';menu.style.display='block'}}
function draw(){const P=PLACES[place];g.fillStyle=P.bg;g.fillRect(0,0,W,H);
 g.fillStyle=P.lane;g.fillRect(8,0,W-16,H);
 g.fillStyle='rgba(255,255,255,.6)';for(let l=1;l<LN;l++)for(let y=-80+off;y<H;y+=80)g.fillRect(l*LW-2,y,4,40);
 g.textAlign='center';
 for(const o of objs){const x=o.l*LW+LW/2;
  if(o.t==='k')drawKid(g,o.k,x,o.y,1.05);else if(o.t==='b')drawBob(g,x,o.y,1.35);
  else{g.font='44px serif';g.fillText(o.e,x,o.y+14)}
  if(o.t!=='i'){g.font='bold 12px sans-serif';g.fillStyle='#fff';g.fillText(o.t==='b'?'BOBCAT':o.k.n,x,o.y+(o.t==='b'?66:56))}}
 if(inv<=0||Math.floor(inv*10)%2){drawKid(g,me,px,PY,1.15);g.font='bold 12px sans-serif';g.fillStyle='#fff';g.textAlign='center';g.fillText('YOU',px,PY+64)}
 sc.textContent='Score '+Math.floor(score);lv.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(3-Math.max(0,lives));bs.textContent='Best '+best}
